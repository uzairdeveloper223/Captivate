name: Checks
# Run on demand while hosted Actions billing is unavailable.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest
